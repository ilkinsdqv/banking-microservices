spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: bank_user
    password: bank_password

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

    show-sql: true

  flyway:
    enabled: true

server:
  port: 8081

clients:
  notification-service:
    url: http://localhost:8087