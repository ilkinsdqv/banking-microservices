spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/banking_db
    username: bank_user
    password: bank_password

  jpa:
    hibernate:
      ddl-auto: update

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

server:
  port: 8081